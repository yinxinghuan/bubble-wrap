<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wind Chime Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;500&family=Noto+Naskh+Arabic:wght@400&family=Noto+Serif+Devanagari:wght@300&family=Cormorant+Garamond:wght@300;500&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #c { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1024" height="1024"></canvas>
<script>
async function main() {
await document.fonts.ready;
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = 1024, H = 1024;

// ─── 1) Tri-band sky gradient: night (left) → dusk (middle) → day (right) ───
// Implemented as 3 vertical bands with smooth blends between them.
const bandPaint = (cfg, x0, x1, transitionLeft, transitionRight) => {
  // base gradient for the band (per theme)
  for (let x = x0; x < x1; x += 1) {
    let alpha = 1;
    // smooth blend with neighbors
    if (transitionLeft && x < x0 + 80) {
      const t = (x - x0) / 80;
      alpha = t;
    } else if (transitionRight && x > x1 - 80) {
      const t = (x1 - x) / 80;
      alpha = t;
    }
    ctx.globalAlpha = alpha;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, cfg[0]);
    g.addColorStop(0.6, cfg[1]);
    g.addColorStop(1, cfg[2]);
    ctx.fillStyle = g;
    ctx.fillRect(x, 0, 1, H);
  }
  ctx.globalAlpha = 1;
};

// Background base: dusk (warmest, will transition both ways into night/day)
{
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0e1a26');
  g.addColorStop(0.55, '#3d2a3d');
  g.addColorStop(1, '#a85a5a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// Smooth horizontal transition: night → dusk → day across width
function smoothBg() {
  const stops = [
    { t: 0, top: '#08121e', mid: '#16213a', bot: '#2c3852' },                     // night
    { t: 0.5, top: '#43253b', mid: '#7e3c4a', bot: '#d77a5a' },                   // dusk
    { t: 1, top: '#a3c8e3', mid: '#e3d7c5', bot: '#f6dca6' },                     // day
  ];
  function lerpHex(a, b, t) {
    const ra = [0,1,2].map(i => parseInt(a.slice(1+i*2, 3+i*2), 16));
    const rb = [0,1,2].map(i => parseInt(b.slice(1+i*2, 3+i*2), 16));
    const out = ra.map((v, i) => Math.round(v + (rb[i] - v) * t));
    return '#' + out.map(v => v.toString(16).padStart(2, '0')).join('');
  }
  function colorAt(x, kind) {
    const tx = x / W;
    let i = 0;
    while (i < stops.length - 1 && stops[i+1].t < tx) i++;
    const a = stops[i], b = stops[Math.min(i+1, stops.length-1)];
    const tt = b.t === a.t ? 0 : (tx - a.t) / (b.t - a.t);
    return lerpHex(a[kind], b[kind], Math.max(0, Math.min(1, tt)));
  }
  // paint per-column gradient
  const step = 4;
  for (let x = 0; x < W; x += step) {
    const top = colorAt(x, 'top');
    const mid = colorAt(x, 'mid');
    const bot = colorAt(x, 'bot');
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, top);
    g.addColorStop(0.55, mid);
    g.addColorStop(1, bot);
    ctx.fillStyle = g;
    ctx.fillRect(x, 0, step, H);
  }
}
smoothBg();

// ─── 2) Sky atmospherics ───
// Stars on the night band (left)
const starSeed = (n) => { let s = n; return () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296; };
const rs = starSeed(7);
for (let i = 0; i < 110; i++) {
  const tx = rs();
  const x = tx * W * 0.5;        // mostly left
  const y = rs() * H * 0.55;
  const sz = 0.4 + rs() * 1.1;
  const a = 0.25 + rs() * 0.65;
  // fade with x to avoid stars in dusk/day
  const fade = Math.max(0, 1 - tx * 1.8);
  ctx.fillStyle = `rgba(220, 220, 255, ${a * fade})`;
  ctx.beginPath(); ctx.arc(x, y, sz, 0, Math.PI * 2); ctx.fill();
  if (i % 14 === 0 && fade > 0.4) {
    ctx.fillStyle = `rgba(180, 180, 255, ${0.18 * fade})`;
    ctx.beginPath(); ctx.arc(x, y, sz * 4, 0, Math.PI * 2); ctx.fill();
  }
}

// Moon top-left
{
  const mx = 130, my = 200, mr = 50;
  const mg = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 1.5);
  mg.addColorStop(0, 'rgba(255, 245, 215, 0.7)');
  mg.addColorStop(0.4, 'rgba(255, 245, 215, 0.18)');
  mg.addColorStop(1, 'rgba(255, 245, 215, 0)');
  ctx.fillStyle = mg;
  ctx.fillRect(0, 0, W * 0.4, H * 0.5);
  // moon disk
  ctx.fillStyle = 'rgba(255, 245, 215, 0.95)';
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
  // shadow crescent
  ctx.fillStyle = 'rgba(0, 0, 30, 0.18)';
  ctx.beginPath(); ctx.arc(mx + 12, my - 4, mr * 0.95, 0, Math.PI * 2); ctx.fill();
}

// Sun on right (day)
{
  const sx = W - 140, sy = 220, sr = 70;
  const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 2.8);
  sg.addColorStop(0, 'rgba(255, 235, 180, 0.85)');
  sg.addColorStop(0.4, 'rgba(255, 235, 180, 0.3)');
  sg.addColorStop(1, 'rgba(255, 235, 180, 0)');
  ctx.fillStyle = sg;
  ctx.fillRect(W * 0.55, 0, W * 0.5, H * 0.5);
  ctx.fillStyle = 'rgba(255, 245, 200, 0.85)';
  ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
}

// Drifting cloud puffs middle (dusk)
{
  ctx.save();
  ctx.globalAlpha = 0.32;
  for (let i = 0; i < 4; i++) {
    const cx = W * (0.35 + i * 0.1);
    const cy = H * (0.18 + (i % 2) * 0.06);
    const cr = 60 + (i % 3) * 18;
    const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr);
    cg.addColorStop(0, 'rgba(255, 220, 200, 0.8)');
    cg.addColorStop(1, 'rgba(255, 220, 200, 0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ─── 3) Beam across the width and three theme chimes ───
// One unified beam that the chimes hang from
const beamY = 470;
const beamH = 14;
{
  const bg = ctx.createLinearGradient(0, beamY, 0, beamY + beamH);
  bg.addColorStop(0, '#1a1108');
  bg.addColorStop(1, '#2a1808');
  ctx.fillStyle = bg;
  ctx.fillRect(48, beamY, W - 96, beamH);
  // shadow underline
  ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
  ctx.fillRect(48, beamY + beamH, W - 96, 4);
  // subtle highlight
  ctx.fillStyle = 'rgba(255, 220, 180, 0.18)';
  ctx.fillRect(48, beamY + 2, W - 96, 1);
}

// Helper: draw a tube chime
function drawTube({ x, top, length, radius, body, edge, glint }) {
  // tube body — vertical gradient (top dark, mid bright, bot darker)
  const tg = ctx.createLinearGradient(x - radius, 0, x + radius, 0);
  tg.addColorStop(0, edge);
  tg.addColorStop(0.4, body);
  tg.addColorStop(0.7, glint);
  tg.addColorStop(1, edge);
  ctx.fillStyle = tg;
  ctx.fillRect(x - radius, top, radius * 2, length);

  // top cap shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
  ctx.beginPath();
  ctx.ellipse(x, top, radius, radius * 0.32, 0, 0, Math.PI * 2);
  ctx.fill();

  // bottom cap (hollow/dark interior)
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.beginPath();
  ctx.ellipse(x, top + length, radius, radius * 0.36, 0, 0, Math.PI * 2);
  ctx.fill();
  // inner ring
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.ellipse(x, top + length, radius * 0.7, radius * 0.24, 0, 0, Math.PI * 2);
  ctx.fill();

  // suspension cord
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, beamY + beamH);
  ctx.lineTo(x, top);
  ctx.stroke();
}

// Brass chimes (left, night) — slim & tall
const brass = {
  body: '#c9943b', edge: '#5b3a0c', glint: '#fff0c2',
  count: 5, baseLen: 240, lenVar: 80, radius: 12, x: 130, dx: 38,
};
// Ceramic chimes (middle, dusk) — short stocky
const ceramic = {
  body: '#f7f2e8', edge: '#a89682', glint: '#ffffff',
  count: 5, baseLen: 150, lenVar: 60, radius: 16, x: 410, dx: 44,
};
// Bamboo chimes (right, day) — variable lengths, hollow bamboo
const bamboo = {
  body: '#a9c265', edge: '#3d5320', glint: '#e8f3a2',
  count: 5, baseLen: 230, lenVar: 100, radius: 13, x: 740, dx: 42,
};

function drawSet(s, lengthsScale = [1, 0.8, 1.05, 0.7, 0.9]) {
  for (let i = 0; i < s.count; i++) {
    const xx = s.x + i * s.dx;
    const len = s.baseLen + (lengthsScale[i] - 1) * s.lenVar;
    drawTube({
      x: xx,
      top: beamY + beamH + 12 + (1 - lengthsScale[i]) * 18,
      length: len,
      radius: s.radius,
      body: s.body, edge: s.edge, glint: s.glint,
    });
  }
}
drawSet(brass);
drawSet(ceramic, [0.9, 1.1, 0.85, 1.0, 0.95]);
drawSet(bamboo, [1.0, 0.65, 1.15, 0.78, 0.92]);

// ─── 4) Striker disc + leaf catcher between brass and ceramic? ───
// Skip — too cluttered. Beam alone reads cleaner.

// ─── 5) Foreground vignette ───
{
  const v = ctx.createRadialGradient(W / 2, H / 2, W * 0.4, W / 2, H / 2, W * 0.75);
  v.addColorStop(0, 'rgba(0, 0, 0, 0)');
  v.addColorStop(1, 'rgba(0, 0, 0, 0.32)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

// ─── 6) Tri-script title in upper safe area ───
ctx.save();
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillStyle = 'rgba(255, 248, 232, 0.96)';
ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
ctx.shadowBlur = 28;

// Tri-script row: 風鈴 (Chinese) · الجرس (Arabic) · घंटी (Devanagari)
const titleY = 110;
ctx.font = '300 88px "Noto Serif SC", serif';
ctx.fillText('風鈴', W * 0.22, titleY);
ctx.font = '400 80px "Noto Naskh Arabic", serif';
ctx.fillText('الجرس', W * 0.5, titleY);
ctx.font = '300 78px "Noto Serif Devanagari", serif';
ctx.fillText('घंटी', W * 0.78, titleY);
ctx.shadowBlur = 0;

// Subtitle: WIND CHIME tracked
ctx.font = '300 22px "JetBrains Mono", monospace';
ctx.fillStyle = 'rgba(255, 248, 232, 0.78)';
const sub = 'W I N D   ·   C H I M E';
ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
ctx.shadowBlur = 14;
ctx.fillText(sub, W / 2, titleY + 84);

ctx.restore();
}
main();
</script>
</body>
</html>
